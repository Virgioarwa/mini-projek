name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Siapkan konfigurasi otomatis
        run: |
          rm -f capacitor.config.ts
          npm pkg set "devDependencies.esbuild=^0.28.0"
          cat > capacitor.config.json << 'EOF'
          {
            "appId": "id.virgiocelluler.pos",
            "appName": "Virgio Celluler",
            "webDir": "dist",
            "android": { "allowMixedContent": false }
          }
          EOF

      - name: Install dependency
        run: |
          npm install
          npm install "@capacitor/core@^7.4.3" "@capacitor/android@^7.4.3" "@capacitor/cli@^7.4.3"

      - name: Build web
        run: npm run build

      - name: Tambah platform Android jika belum ada
        run: |
          if [ ! -d android ]; then npx cap add android; fi

      - name: Sync ke Android
        run: npx cap sync android

      - name: Build APK debug
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: virgio-celluler-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
